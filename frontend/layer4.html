<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layer 4: Reasoning Layer - LoanTrace AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-dark: #07090e; --border-color: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4; --accent-indigo: #6366f1; --accent-emerald: #10b981;
      --text-primary: #f1f5f9; --text-muted: #64748b; --font-sans: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-dark); color: var(--text-primary); font-family: var(--font-sans); min-height: 100vh; }
    .glass-panel { background: rgba(18, 24, 38, 0.75); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 16px; }
    .app-header { border-bottom: 1px solid var(--border-color); background: rgba(7, 9, 14, 0.85); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo-badge { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan)); display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; }
    .logo-title { font-weight: 800; font-size: 1.35rem; }
    .main-container { max-width: 1440px; margin: 0 auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .page-nav { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; overflow-x: auto; }
    .nav-item { padding: 0.75rem 1.25rem; border-radius: 10px; border: 1px solid var(--border-color); text-decoration: none; color: #94a3b8; font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
    .nav-item.active { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(6, 182, 212, 0.2)); border-color: var(--accent-cyan); color: #fff; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan)); color: white; border: none; padding: 0.85rem 1.75rem; border-radius: 10px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid var(--border-color); padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 500; font-size: 0.85rem; cursor: pointer; text-align: left; }
    .badge { padding: 0.25rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .badge-cyan { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.3); }
    .stat-card { background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    function Layer4() {
      const session = JSON.parse(localStorage.getItem('loantrace_session') || 'null');
      const [question, setQuestion] = useState("Confirm the one loan amount that should be identical across URLA 1003, Form 1008, Closing Disclosure, and Loan Estimate.");
      const [asking, setAsking] = useState(false);
      const [persona, setPersona] = useState("Strict Underwriter");

      const sampleQuestions = [
        "Confirm the one loan amount that should be identical across URLA 1003, Form 1008, Closing Disclosure, and Loan Estimate.",
        "Do the W-2 box 1 wages reconcile with the wages on the Form 1040?",
        "What is the borrower's stated monthly income?",
        "What is the property address?",
        "How many paystubs are included in this file?",
        "What is the down payment, that is, purchase price minus loan amount?"
      ];

      const handleAsk = async (qText) => {
        const targetQ = qText || question;
        if (!session) {
          alert("Please upload a mortgage PDF on Page 1 first.");
          return;
        }

        setAsking(true);
        try {
          const res = await fetch("http://localhost:8001/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: session.session_id, question: targetQ, top_k: 5 }),
          });
          if (!res.ok) throw new Error("Query failed");
          const data = await res.json();
          localStorage.setItem('loantrace_answer', JSON.stringify(data));
          window.location.href = 'layer6.html';
        } catch (err) {
          alert(`Query failed: ${err.message}`);
        } finally {
          setAsking(false);
        }
      };

      return (
        <div>
          <header className="app-header">
            <div className="logo-badge">
              <div className="logo-icon">LT</div>
              <div>
                <div className="logo-title">LoanTrace AI</div>
                <div style={{ fontSize: '0.75rem', color: 'var(--accent-cyan)' }}>Page 4 of 6 • Underwriting Question Router & Reasoning Engine</div>
              </div>
            </div>
          </header>

          <main className="main-container">
            <div className="page-nav">
              <a href="layer1.html" className="nav-item">📄 Page 1: PDF Upload</a>
              <a href="layer2.html" className="nav-item">📚 Page 2: Extraction & DSL</a>
              <a href="layer3.html" className="nav-item">🔢 Page 3: Embedding & FAISS</a>
              <a href="layer4.html" className="nav-item active">⚡ Page 4: Reasoning Layer</a>
              <a href="layer5.html" className="nav-item">🛡️ Page 5: Trust Layer & MCM</a>
              <a href="layer6.html" className="nav-item">✅ Page 6: Answer & Evidence</a>
            </div>

            <div className="glass-panel" style={{ padding: '2rem' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
                <div>
                  <h2 style={{ fontSize: '1.4rem', fontWeight: 800 }}>Layer 4: Underwriter Question Router & LLM Reasoning Console</h2>
                  <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>Directs queries into DIRECT_LOOKUP, AGGREGATION, VERIFICATION, or LLM_REASONING routes.</p>
                </div>
              </div>

              {!session ? (
                <div style={{ textAlign: 'center', padding: '3rem' }}>
                  <p style={{ color: 'var(--text-muted)' }}>No active PDF session found.</p>
                  <a href="layer1.html" className="nav-item active" style={{ display: 'inline-block', marginTop: '1rem' }}>Go to Page 1: Upload PDF →</a>
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1rem' }}>
                    <div className="stat-card">
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontWeight: 700 }}>LLM REASONING MODEL</div>
                      <div style={{ fontSize: '1.1rem', fontWeight: 800, color: 'var(--accent-cyan)' }}>Llama 3 8B / Gemini 1.5</div>
                    </div>
                    <div className="stat-card">
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontWeight: 700 }}>UNDERWRITING POLICY</div>
                      <select value={persona} onChange={(e) => setPersona(e.target.value)} style={{ background: 'transparent', border: 'none', color: '#fff', fontSize: '0.95rem', fontWeight: 800, cursor: 'pointer', outline: 'none' }}>
                        <option value="Strict Underwriter" style={{ background: '#000' }}>Strict Fannie Mae Guidelines</option>
                        <option value="FHA Quality Audit" style={{ background: '#000' }}>FHA Quality Control</option>
                        <option value="Standard Audit" style={{ background: '#000' }}>Standard Underwriter Audit</option>
                      </select>
                    </div>
                    <div className="stat-card">
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontWeight: 700 }}>AVAILABLE ROUTES</div>
                      <div style={{ fontSize: '0.9rem', fontWeight: 700, color: 'var(--accent-emerald)' }}>Verification • Aggregation • Lookup</div>
                    </div>
                  </div>

                  <div>
                    <label style={{ fontSize: '0.9rem', fontWeight: 700, color: '#94a3b8', marginBottom: '0.5rem', display: 'block' }}>
                      Enter Underwriting Audit Query:
                    </label>
                    <input
                      type="text" value={question} onChange={(e) => setQuestion(e.target.value)}
                      placeholder="Type question or select a preset below..."
                      style={{ width: '100%', padding: '1rem', background: 'rgba(0,0,0,0.3)', border: '1px solid var(--border-color)', borderRadius: '10px', color: '#fff', fontSize: '1rem' }}
                    />
                  </div>

                  <div>
                    <button className="btn-primary" onClick={() => handleAsk()} disabled={asking}>
                      {asking ? "Executing Reasoning Engine..." : "Execute Underwriter Reasoning Query →"}
                    </button>
                  </div>

                  <div style={{ marginTop: '0.5rem' }}>
                    <div style={{ fontSize: '0.8rem', fontWeight: 700, color: 'var(--text-muted)', marginBottom: '0.5rem' }}>
                      PRESET UNDERWRITING AUDIT QUESTIONS:
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                      {sampleQuestions.map((q, idx) => (
                        <button key={idx} className="btn-secondary" onClick={() => { setQuestion(q); handleAsk(q); }}>
                          ❓ {q}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Layer4 />);
  </script>
</body>
</html>
